apis:
- name: Aserto Decision Logs API
  description: >
    Collects and surfaces a complete audit trail of authorization decisions made by connected Authorizer
    instances. Supports compliance, debugging, and analytics use cases by recording who was authorized
    (or denied), which policy evaluated the decision, and the context at decision time.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.aserto.com/docs/api-reference
  baseURL: https://console.aserto.com
  tags:
  - Decision Logs
  - Audit
  - Compliance
  properties:
  - type: Documentation
    url: https://docs.aserto.com/docs/api-reference
- name: Aserto Control Plane API
  description: >
    Management API for the Aserto SaaS control plane (wound down May 2025, succeeded by the open-source
    Topaz project). Provided lifecycle management of policies, Edge Authorizer instances, tenants, and
    connection configurations. Referenced here for historical completeness; the open-source Topaz project
    at github.com/aserto-dev/topaz carries forward the self-hosted control-plane functionality.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
